services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: /data/database.sqlite
      SERVER_PORT: '3000'
      SERVER_PORT_WS: '3001'
    volumes:
      - keyforge_data:/data
    expose: ['3000', '3001']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/code-lab/index.html').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  keyforge_data:
  caddy_data:
  caddy_config:
